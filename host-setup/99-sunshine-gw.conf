# Weiterleiten muss der Kernel des Gateways erlauben. Mit network_mode: host kann
# Docker keine net.*-Sysctls setzen und /proc/sys ist im Container read-only,
# deshalb gehoert das auf den Host:
#
#   sudo cp host-setup/99-sunshine-gw.conf /etc/sysctl.d/99-sunshine-gw.conf
#   sudo sysctl --system
#
net.ipv4.ip_forward = 1

# Vorsichtsmassnahme, nicht zwingend: Gateway und Ziel haengen am selben Interface,
# und manche Distributionen setzen rp_filter streng. Im lockeren Modus reicht eine
# beliebige Route zurueck zur Quelle, was fuer NAT-Rueckwege der robustere Wert ist.
net.ipv4.conf.all.rp_filter = 2

# Zaehlt Bytes pro Verbindung. Nur damit kann das Web-Interface sagen, welche Adresse
# wieviel bewegt hat; ohne das bleiben Clients und Flows sichtbar, die Datenmengen nicht.
# Kostet zwei Zaehler-Inkremente pro Paket in einem Codepfad, den conntrack fuer die
# Uebersetzung sowieso durchlaeuft - messbar ist das nicht.
net.netfilter.nf_conntrack_acct = 1
