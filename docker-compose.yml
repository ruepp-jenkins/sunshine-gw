services:
  sunshine-gw:
    # Published multi-arch by Jenkins; `docker compose pull` is the update path and
    # `docker compose up -d` fetches the image on its own when it is missing.
    #
    # Deliberately no `build:` section: with one present, compose would build from source
    # instead of pulling whenever the image is absent locally - on the gateway, which has
    # neither the sources nor a Go toolchain, that is the wrong default. A local build is
    # `make image`, which uses the Dockerfile directly.
    image: ruepp/sunshine-gw:latest
    container_name: sunshine-gw
    # The container shares the host's network stack: the FRITZ!Box port forward points
    # at this machine's LAN address, and the rules this process loads are the host's.
    network_mode: host
    cap_add:
      - NET_ADMIN   # load nftables rules, write iptables chains
      - NET_RAW     # required by iptables for some matches
    env_file: .env
    environment:
      # Bind the UI to the LAN address, never to 0.0.0.0, and never to a forwarded port.
      GW_LISTEN: ${GW_LISTEN:?GW_LISTEN fehlt, z.B. 10.10.10.20:8080}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nft", "list", "tables"]
      interval: 60s
      timeout: 5s
      retries: 3
